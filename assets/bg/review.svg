<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rvSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06070c"/>
      <stop offset=".4" stop-color="#0e121c"/>
      <stop offset="1" stop-color="#151018"/>
    </linearGradient>
    <linearGradient id="rvTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2430"/>
      <stop offset="1" stop-color="#121018"/>
    </linearGradient>
    <linearGradient id="rvBlind" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1e28"/>
      <stop offset="1" stop-color="#0c1018"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#rvSky)"/>
  <!-- blinds / window strip -->
  <rect x="48" y="90" width="624" height="380" fill="#0a0e16" stroke="#2a3348" opacity=".7"/>
  <g opacity=".4">
    <rect x="60" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="100" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="140" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="180" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="220" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="260" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="300" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="340" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="380" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="420" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="460" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="500" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="540" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="580" y="105" width="28" height="350" fill="url(#rvBlind)"/>
    <rect x="620" y="105" width="28" height="350" fill="url(#rvBlind)"/>
  </g>
  <!-- faint city glow through blinds -->
  <g fill="#c9a46a" opacity=".12">
    <rect x="70" y="140" width="40" height="28"/><rect x="150" y="160" width="36" height="24"/>
    <rect x="230" y="130" width="44" height="30"/><rect x="320" y="155" width="38" height="26"/>
    <rect x="410" y="145" width="42" height="28"/><rect x="500" y="165" width="36" height="22"/>
    <rect x="580" y="135" width="40" height="30"/>
  </g>
  <!-- floor line -->
  <rect x="0" y="640" width="720" height="12" fill="#cfd6e4" opacity=".08"/>
  <!-- long review table -->
  <rect x="100" y="720" width="520" height="18" fill="url(#rvTable)"/>
  <rect x="120" y="700" width="60" height="40" fill="#1a1520" opacity=".6"/>
  <rect x="540" y="700" width="60" height="40" fill="#1a1520" opacity=".6"/>
  <!-- folder / form stack -->
  <rect x="280" y="680" width="160" height="48" rx="2" fill="#1c2230" stroke="#c9a46a" opacity=".45"/>
  <rect x="290" y="690" width="140" height="4" fill="#c9a46a" opacity=".25"/>
  <rect x="290" y="700" width="100" height="3" fill="#8a7048" opacity=".3"/>
  <!-- single tube light strip -->
  <rect x="200" y="40" width="320" height="6" fill="#d0e0ff" opacity=".2"/>
  <!-- cctv dot -->
  <circle cx="660" cy="48" r="5" fill="#ff3b3b"/>
</svg>
