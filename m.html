<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>加班之後</title>
  <link rel="stylesheet" href="./styles.css?v=m6" />
  <style>
    #chars{display:grid;gap:12px;padding:12px 0 32px}
    #screen-play.active .portrait-stack,#screen-play.active .play-bg{animation:none!important}
    .portrait-stack{position:absolute;inset:0}
  </style>
</head>
<body>
  <main class="app">
    <section id="screen-gate" class="screen active">
      <div class="gate-hero">
        <p class="brand">AFTER HOURS</p>
        <h1>加班之後</h1>
        <button id="enter-btn" class="btn btn-primary" type="button">我已年滿 18 歲，進入</button>
      </div>
    </section>
    <section id="screen-cast" class="screen">
      <h1 class="h-cast">選擇角色</h1>
      <div class="chars" id="chars">
        <article class="card glass char-card"><h2>Vera</h2><button class="btn btn-primary" type="button" data-start="alex">開始</button></article>
        <article class="card glass char-card"><h2>Morgan</h2><button class="btn btn-primary" type="button" data-start="morgan">開始</button></article>
        <article class="card glass char-card"><h2>Sam</h2><button class="btn btn-primary" type="button" data-start="sam">開始</button></article>
      </div>
    </section>
    <section id="screen-play" class="screen">
      <div class="play-stage">
        <div class="play-bg">
          <div class="portrait-stack" id="alex-portrait-stack">
            <img id="alex-portrait" class="portrait" src="./assets/alex.png" alt="" />
          </div>
          <div class="play-bg-scrim"></div>
        </div>
        <div class="play-overlay">
          <div class="topbar play-topbar">
            <p id="play-label" class="play-label"></p>
            <button id="back-cast" class="btn btn-ghost btn-tiny" type="button">角色</button>
          </div>
          <div class="play-face-gap"></div>
          <div class="play-lower">
            <div class="card glass narrative-bubble"><p id="play-text" class="narrative"></p></div>
            <div id="choices" class="stack choices"></div>
          </div>
        </div>
      </div>
    </section>
    <section id="screen-ending" class="screen">
      <h2 id="ending-title"></h2>
      <p id="ending-text"></p>
      <button id="ending-replay" class="btn btn-primary" type="button">再玩</button>
      <button id="ending-cast" class="btn btn-ghost" type="button">返回</button>
    </section>
  </main>
  <script src="./life.js"></script>
</body>
</html>
