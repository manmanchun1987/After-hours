<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>加班之後</title>
  <link rel="stylesheet" href="./styles.css?v=cast5" />
  <style>
    #chars{display:grid;gap:14px;padding:12px 0 40px}
    .char-card{padding:12px}
    .char-card img{width:100%;height:150px;object-fit:cover;object-position:center 18%;border-radius:12px;margin-bottom:8px}
    .char-card .role{opacity:.7;margin:0 0 6px;font-size:12px}
    .char-card .hook{margin:0 0 12px;font-size:13px;line-height:1.45}
    #vera-vid,#alex-portrait{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
    #vera-vid{z-index:1;background:#000}
    .portrait-stack{position:absolute;inset:0;overflow:hidden}
    #grade-veil,#grade-vignette{position:absolute;inset:0;pointer-events:none;z-index:2;transition:background .45s ease,opacity .45s ease}
    #grade-vignette{z-index:3;box-shadow:inset 0 0 80px 24px #00000088}
    #thought-slot,#aside-slot,#memory-strip{margin:0 16px 8px}
    #play-thought{font-style:italic;margin:0;font-size:13px;opacity:.9}
    #play-aside{margin:0;font-size:12px;opacity:.7}
    #memory-chips{display:flex;flex-wrap:wrap;gap:6px}
    #memory-chips .chip{font-size:11px;padding:4px 8px;border:1px solid #d4b48355;border-radius:99px}
    .meters{display:flex;gap:10px;padding:0 16px 8px}
    .meter{flex:1;font-size:11px}
    .meter i{display:block;height:4px;background:#ffffff22;border-radius:99px;margin-top:4px;overflow:hidden}
    .meter b{display:block;height:100%;width:20%;background:#d4b483}
    .btn-cg{border-color:#e8a0b8;color:#f3c6d4}
    body[data-scene="hall"] #grade-veil{background:linear-gradient(180deg,#0a1a2ecc 0%,#08101899 40%,#000000aa 100%)}
    body[data-scene="hall"] #grade-vignette{box-shadow:inset 0 0 90px 30px #02060e}
    body[data-scene="meet"] #grade-veil{background:linear-gradient(180deg,transparent 20%,#0b1420aa 100%)}
    body[data-scene="close"] #grade-veil{background:linear-gradient(180deg,#3a101055 0%,transparent 35%,#1a080ccc 100%)}
    body[data-scene="dark"] #grade-veil{background:radial-gradient(ellipse at 50% 35%,transparent 12%,#000000dd 70%)}
    body[data-scene="dark"] #grade-vignette{box-shadow:inset 0 0 120px 50px #000}
    body[data-scene="review"] #grade-veil{background:linear-gradient(180deg,#c8d0d833 0%,transparent 30%,#12161ccc 100%)}
    body[data-scene="dawn"] #grade-veil{background:linear-gradient(180deg,#c4a07044 0%,transparent 40%,#2a1c10aa 100%)}
  </style>
</head>
<body>
  <main class="app">
    <section id="screen-gate" class="screen active">
      <div class="gate-hero">
        <p class="brand">AFTER HOURS</p>
        <h1>加班之後</h1>
        <button id="enter-btn" class="btn btn-primary" type="button">我已年滿 18 歲，進入</button>
      </div>
    </section>
    <section id="screen-cast" class="screen">
      <h1 class="h-cast">選擇角色</h1>
      <div class="chars" id="chars">
        <article class="card glass char-card">
          <img src="./assets/IMG_1412.jpeg" alt="">
          <h2>Vera</h2>
          <p class="role">部門主管 · 週五 23:47</p>
          <p class="hook">Deadline 可以改。態度唔可以。</p>
          <button class="btn btn-primary" type="button" data-start="alex">開始</button>
        </article>
        <article class="card glass char-card">
          <img src="./assets/IMG_1411.jpeg" alt="">
          <h2>Elise</h2>
          <p class="role">客戶負責人 · 酒廊 21:10</p>
          <p class="hook">大單前夜。夜晚講人。</p>
          <button class="btn btn-primary" type="button" data-start="morgan">開始</button>
        </article>
        <article class="card glass char-card">
          <img src="./assets/IMG_1410.jpeg" alt="">
          <h2>Sammi</h2>
          <p class="role">前輩同事 · 茶水間 22:40</p>
          <p class="hook">兩個杯麵。餓嘅人簽錯字。</p>
          <button class="btn btn-primary" type="button" data-start="sam">開始</button>
        </article>
      </div>
    </section>
    <section id="screen-play" class="screen">
      <div class="play-stage">
        <div class="play-bg">
          <div class="portrait-stack" id="alex-portrait-stack">
            <img id="alex-portrait" class="portrait" src="./assets/IMG_1412.jpeg" alt="" />
            <video id="vera-vid" muted loop playsinline poster="./assets/IMG_1412.jpeg"></video>
            <div id="grade-veil"></div>
            <div id="grade-vignette"></div>
          </div>
          <div class="play-bg-scrim"></div>
        </div>
        <div class="play-overlay">
          <div class="topbar play-topbar">
            <p id="play-label" class="play-label"></p>
            <button id="back-cast" class="btn btn-ghost btn-tiny" type="button">角色</button>
          </div>
          <div class="meters"><div class="meter">熱度<i><b id="meter-heat"></b></i></div><div class="meter">張力<i><b id="meter-tension"></b></i></div></div>
          <div id="memory-strip" hidden><div id="memory-chips"></div></div>
          <div id="thought-slot" hidden><p id="play-thought"></p></div>
          <div id="aside-slot" hidden><p id="play-aside"></p></div>
          <div class="play-face-gap"></div>
          <div class="play-lower">
            <div class="card glass narrative-bubble"><p id="play-text" class="narrative"></p></div>
            <div id="choices" class="stack choices"></div>
          </div>
        </div>
      </div>
    </section>
    <section id="screen-ending" class="screen">
      <h2 id="ending-title"></h2>
      <p id="ending-text"></p>
      <button id="ending-replay" class="btn btn-primary" type="button">再玩</button>
      <button id="ending-cast" class="btn btn-ghost" type="button">返回</button>
    </section>
  </main>
  <script src="./life.js?v=live16"></script>
</body>
</html>
